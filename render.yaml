# 톡톡 Talk Talk - Render 배포 정의
services:
  - type: web
    name: talktalk-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: talktalk-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: talktalk-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /var/data/storage
      - key: IDENTITY_PROVIDER
        sync: false
      - key: IDENTITY_PROVIDER_API_KEY
        sync: false
      - key: IAP_PROVIDER
        value: live
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: co.kr.eumsoft.talktalk
      - key: GOOGLE_PLAY_ACCESS_TOKEN
        sync: false
      - key: APPLE_SHARED_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: admin@talktalk.eumsoft.co.kr
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: talktalk-media
      mountPath: /var/data
      sizeGB: 10

  - type: web
    name: talktalk-admin
    runtime: node
    plan: starter
    region: singapore
    rootDir: admin
    buildCommand: npm ci && npm run build
    startCommand: node .next/standalone/admin/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        sync: false
      - key: PORT
        value: 10000

  - type: keyvalue
    name: talktalk-redis
    plan: starter
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: talktalk-db
    plan: basic-256mb
    region: singapore
    databaseName: tanktalk
    user: talktalk
    postgresMajorVersion: "16"
